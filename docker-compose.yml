services:
  web:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - recipes_net

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: recipes
      POSTGRES_PASSWORD: recipes123
      POSTGRES_DB: recipesdb
    networks:
      - recipes_net

networks:
  recipes_net:

